version: '2'

services:
  pantry-api:
    image: klschaefer/pantry-api:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 4300:4300
    env_file:
      - stack.env
    environment:
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - PLAYWRIGHT_MCP_HOST=${PLAYWRIGHT_MCP_HOST:-playwright-mcp}
      - PLAYWRIGHT_MCP_PORT=${PLAYWRIGHT_MCP_PORT:-8930}
      - PLAYWRIGHT_NOVNC_HOST=${PLAYWRIGHT_NOVNC_HOST:-playwright-mcp}
      - PLAYWRIGHT_NOVNC_PORT=${PLAYWRIGHT_NOVNC_PORT:-6080}
      - TZ=${TZ:-UTC}
      - MQTT_BROKER=${MQTT_BROKER:-}
      # HassNote home-audio MCP bridge. Unset = audio voice tools disabled.
      - HOMEAUDIO_URL=${HOMEAUDIO_URL:-}
      - HOMEAUDIO_API_TOKEN=${HOMEAUDIO_API_TOKEN:-}
      # Kokoro TTS on the Mac Studio, proxied by the API so the browser does not
      # need CORS on a bare LAN service. Unset = the kiosk's speak toggle reports
      # TTS unavailable and replies stay on screen. See docs/voice-stack.md.
      - TTS_URL=${TTS_URL:-}
      - TTS_MODEL=${TTS_MODEL:-mlx-community/Kokoro-82M-bf16}
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-pantry}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_AUTHORIZATION_URL=${OAUTH_AUTHORIZATION_URL:-}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL:-}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL:-}
      - OAUTH_BUTTON_TEXT=${OAUTH_BUTTON_TEXT:-Login with SSO}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid profile email}
      - DISABLE_LOCAL_LOGIN=${DISABLE_LOCAL_LOGIN:-false}
    volumes:
      - pantry_data:/app/data
  pantry-ui:
    image: klschaefer/pantry-ui:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 4200:80
    environment:
      - API_BASEURL=${API_BASEURL}
      - SITE_TITLE=${SITE_TITLE}
      - TZ=${TZ:-UTC}
    # Removed host-dependent timezone volumes to fix Portainer deployment issues

  # wyoming-whisper removed 2026-09-23. Speech-to-text now runs on the Mac
  # Studio (10.36.222.234:10300) as a launchd service, shared across the LAN.
  # Measured on the same 12 utterances: the same model class took 2.42s here
  # against 0.65s there, because this box's four performance cores are shared
  # with Home Assistant, Music Assistant and a dozen other containers.
  # Point WHISPER_HOST at the Studio; nothing else changes.

  playwright-mcp:
    build: ./playwright-mcp
    container_name: playwright-mcp
    restart: unless-stopped
    ports:
      - 5900:5900 # VNC
      - 6080:6080 # noVNC web interface
      - 8930:8930 # Playwright MCP HTTP API (via socat forwarder)
    environment:
      - VNC_PASSWORD=playwright
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - TZ=${TZ:-UTC}
    volumes:
      - pantry_playwright_data:/app/browser-data

volumes:
  pantry_data:
  pantry_playwright_data:


