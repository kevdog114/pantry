version: '2'

services:
  pantry-api:
    image: klschaefer/pantry-api:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 4300:4300
    env_file:
      - stack.env
    environment:
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD}
      - PLAYWRIGHT_MCP_HOST=${PLAYWRIGHT_MCP_HOST:-playwright-mcp}
      - PLAYWRIGHT_MCP_PORT=${PLAYWRIGHT_MCP_PORT:-8930}
      - PLAYWRIGHT_NOVNC_HOST=${PLAYWRIGHT_NOVNC_HOST:-playwright-mcp}
      - PLAYWRIGHT_NOVNC_PORT=${PLAYWRIGHT_NOVNC_PORT:-6080}
      - TZ=${TZ:-UTC}
      - MQTT_BROKER=${MQTT_BROKER:-}
      # HassNote home-audio MCP bridge. Unset = audio voice tools disabled.
      - HOMEAUDIO_URL=${HOMEAUDIO_URL:-}
      - HOMEAUDIO_API_TOKEN=${HOMEAUDIO_API_TOKEN:-}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-pantry}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_AUTHORIZATION_URL=${OAUTH_AUTHORIZATION_URL:-}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-}
      - OAUTH_USERINFO_URL=${OAUTH_USERINFO_URL:-}
      - OAUTH_CALLBACK_URL=${OAUTH_CALLBACK_URL:-}
      - OAUTH_BUTTON_TEXT=${OAUTH_BUTTON_TEXT:-Login with SSO}
      - OAUTH_SCOPES=${OAUTH_SCOPES:-openid profile email}
      - DISABLE_LOCAL_LOGIN=${DISABLE_LOCAL_LOGIN:-false}
    volumes:
      - pantry_data:/app/data
  pantry-ui:
    image: klschaefer/pantry-ui:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - 4200:80
    environment:
      - API_BASEURL=${API_BASEURL}
      - SITE_TITLE=${SITE_TITLE}
      - TZ=${TZ:-UTC}
    # Removed host-dependent timezone volumes to fix Portainer deployment issues

  wyoming-whisper:
    image: rhasspy/wyoming-whisper
    restart: unless-stopped
    ports:
      - 10300:10300
    volumes:
      - pantry_whisper:/data
    # The initial prompt biases decoding. It listed pantry vocabulary only, and
    # with voice now driving the audio system "play" was consistently misheard
    # as "clay" or "place" (3 of 4 test utterances), so the music verbs and the
    # room names are listed too.
    # List form: the prompt contains quotes and punctuation, which a plain
    # YAML scalar mis-parses (a bare "rooms: " ended the value).
    command:
      - "--model"
      # int8 rather than full precision: this is CPU inference on an 8-core ARM
      # box with ~2.7GB spare, so the quantised weights buy accuracy without
      # the memory and latency cost of the float build.
      - "small-int8"
      - "--language"
      - "en"
      - "--initial-prompt"
      - "pantry kitchen food ingredients recipe shopping list add remove cook bake fridge freezer canned dry goods spices dairy meat vegetables fruit. play pause resume skip next previous stop volume louder quieter music song album artist playlist station. rooms kitchen bedroom office basement garage master bath."

  playwright-mcp:
    build: ./playwright-mcp
    container_name: playwright-mcp
    restart: unless-stopped
    ports:
      - 5900:5900 # VNC
      - 6080:6080 # noVNC web interface
      - 8930:8930 # Playwright MCP HTTP API (via socat forwarder)
    environment:
      - VNC_PASSWORD=playwright
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - TZ=${TZ:-UTC}
    volumes:
      - pantry_playwright_data:/app/browser-data

volumes:
  pantry_data:
  pantry_whisper:
  pantry_playwright_data:


