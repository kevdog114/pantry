server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Caching strategy.
    #
    # Nothing set any Cache-Control before, so browsers fell back to heuristic
    # caching (roughly 10% of the age since Last-Modified). Combined with the
    # service worker that meant a deploy took several refreshes to appear, and
    # devices refreshed at the same moment could land on different versions.
    #
    # The build fingerprints its JS and CSS, so those are safe to cache
    # forever. Everything that decides *which* build you get — index.html and
    # the service worker's own files — must be revalidated every time.

    # Build manifest and worker: never served stale, or the app cannot notice
    # a new version.
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /safety-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Fingerprinted bundles: the filename changes when the content does, so a
    # stale copy is impossible and a year is safe.
    location ~* "-[A-Z0-9]{8,}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Media keeps a modest lifetime: not fingerprinted, but rarely urgent.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|otf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    location / {
        # Redirect all requests to index.html so Angular handles the routing
        try_files $uri $uri/ /index.html;

        # index.html points at the fingerprinted bundles, so caching it is what
        # pins a browser to an old build. Always revalidate.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
}
