<div class="abbreviations-page">
  <div class="settings-card">
    <h2>Word Abbreviations</h2>
    <p class="subtitle">Define abbreviations to shorten text on labels. Full word(s) can be comma-separated for multiple variants.</p>

    <div class="add-form">
      <mat-form-field appearance="outline" class="words-field">
        <mat-label>Full Word(s)</mat-label>
        <input matInput [(ngModel)]="newWords" placeholder="e.g. chicken,chickens" />
      </mat-form-field>
      <mat-form-field appearance="outline" class="short-field">
        <mat-label>Abbreviated Text</mat-label>
        <input matInput [(ngModel)]="newShort" placeholder="e.g. chkn" />
      </mat-form-field>
      <button mat-flat-button color="primary" (click)="addAbbreviation()">
        <mat-icon>add</mat-icon>
        Add
      </button>
    </div>

    <div class="table-container">
      <table mat-table [dataSource]="dataSource" class="abbreviations-table">
        <ng-container matColumnDef="words">
          <th mat-header-cell *matHeaderCellDef>Full Word(s)</th>
          <td mat-cell *matCellDef="let abbr">{{abbr.words}}</td>
        </ng-container>

        <ng-container matColumnDef="short">
          <th mat-header-cell *matHeaderCellDef>Abbreviation</th>
          <td mat-cell *matCellDef="let abbr">{{abbr.short}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let abbr">
            <button mat-icon-button color="primary" (click)="editAbbreviation(abbr)" title="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteAbbreviation(abbr)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <div *ngIf="dataSource.length === 0" class="empty-state">
      No abbreviations defined yet. Add one above to get started.
    </div>
  </div>
</div>
