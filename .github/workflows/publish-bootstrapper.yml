name: Publish Bootstrapper Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'rpi-kiosk/bootstrapper/**'

jobs:
  build_and_publish:
    runs-on: [self-hosted, trusted]
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from latest semver tag
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          VERSION=${VERSION#v}
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION, build date: $BUILD_DATE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Bootstrapper image
        uses: docker/build-push-action@v6
        with:
          context: rpi-kiosk/bootstrapper
          file: rpi-kiosk/bootstrapper/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pantry-bootstrapper:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pantry-bootstrapper:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
